<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal de Inteligencia Bursátil y Macroeconómica</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Marked.js para renderizar Markdown del informe -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <!-- Encabezado Principal -->
  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-50 py-4 px-6 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
        Terminal Macroeconómico Matutino
      </h1>
      <p id="fecha-actualizacion" class="text-xs text-slate-400 mt-0.5">Cargando datos...</p>
    </div>
    <span class="text-xs bg-slate-800 border border-slate-700 text-slate-300 px-2.5 py-1 rounded">Versión MVP</span>
  </header>

  <main class="max-w-7xl mx-auto p-6 space-y-6">

    <!-- Sección 1: Ticker Bar (Métricas Cuantitativas Clave) -->
    <section>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4" id="contenedor-metricas">
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">VIX</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">Ratio SPY/RSP</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">Liquidez Neta (FED)</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">Put/Call Ratio</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">High Yield (HYG/IEI)</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
        <div class="bg-slate-800/60 border border-slate-700/60 p-4 rounded-lg animate-pulse">
          <p class="text-xs text-slate-400">Cobre/Oro (COPX/GLD)</p>
          <p class="text-lg font-semibold text-white mt-1">--</p>
        </div>
      </div>
    </section>

    <!-- Sección 2: Informe Matutino de Inteligencia -->
    <section class="bg-slate-800/40 border border-slate-700/60 rounded-xl p-6 lg:p-8">
      <div class="border-b border-slate-700/60 pb-4 mb-6 flex justify-between items-center">
        <h2 class="text-lg font-bold text-white flex items-center gap-2">
          Informe de Inteligencia de Mercado
        </h2>
        <span class="text-xs text-emerald-400 font-mono bg-emerald-950/40 border border-emerald-800/50 px-2 py-0.5 rounded">
          Gemini 3.8 Flash
        </span>
      </div>
      <article id="contenido-informe" class="prose prose-invert max-w-none prose-headings:text-slate-100 prose-p:text-slate-300 prose-li:text-slate-300 prose-strong:text-white">
        <p class="text-slate-400 italic">Cargando reporte diario...</p>
      </article>
    </section>

  </main>

  <script>
    async function cargarTerminal() {
      try {
        // Cargar matriz cuantitativa
        const resDatos = await fetch('datos_hoy.json');
        if (resDatos.ok) {
          const datos = await resDatos.json();
          renderizarMetricas(datos);
        }

        // Cargar informe en Markdown
        const resInforme = await fetch('informe_hoy.md');
        if (resInforme.ok) {
          const md = await resInforme.text();
          document.getElementById('contenido-informe').innerHTML = marked.parse(md);
        } else {
          document.getElementById('contenido-informe').innerHTML = '<p class="text-amber-400">No se encontró informe_hoy.md en el repositorio.</p>';
        }
      } catch (err) {
        console.error("Error cargando archivos:", err);
      }
    }

    function renderizarMetricas(d) {
      document.getElementById('fecha-actualizacion').textContent = `Última captura: ${d.fecha || 'Hoy'}`;

      const vix = d.indices_mercado?.VIX?.precio?.toFixed(2) || '--';
      const spyRsp = d.amplitud_mercado?.Ratio_SPY_RSP?.toFixed(4) || '--';
      const liqNeta = d.macro_fred?.Liquidez_Neta_Billones_USD ? `$${d.macro_fred.Liquidez_Neta_Billones_USD.toFixed(3)}T` : '--';
      const pcr = d.opciones_spy?.Put_Call_Ratio_Volumen?.toFixed(2) || '--';
      const hygIei = d.leading_indicators?.Ratio_High_Yield_HYG_IEI?.toFixed(4) || '--';
      const copxGld = d.leading_indicators?.Ratio_Cobre_Oro_COPX_GLD?.toFixed(4) || '--';

      const contenedor = document.getElementById('contenedor-metricas');
      contenedor.innerHTML = `
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">VIX</p>
          <p class="text-xl font-bold text-white mt-1">${vix}</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">Ratio SPY/RSP</p>
          <p class="text-xl font-bold text-white mt-1">${spyRsp}</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">Liquidez Neta FED</p>
          <p class="text-xl font-bold text-white mt-1">${liqNeta}</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">Put/Call Ratio</p>
          <p class="text-xl font-bold text-white mt-1">${pcr}</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">HYG / IEI (Crédito)</p>
          <p class="text-xl font-bold text-white mt-1">${hygIei}</p>
        </div>
        <div class="bg-slate-800/80 border border-slate-700 p-4 rounded-lg">
          <p class="text-xs text-slate-400 font-medium">COPX / GLD (Macro)</p>
          <p class="text-xl font-bold text-white mt-1">${copxGld}</p>
        </div>
      `;
    }

    cargarTerminal();
  </script>
</body>
</html>
