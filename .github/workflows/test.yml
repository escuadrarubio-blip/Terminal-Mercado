name: Terminal Mercado Automatizado

on:
  schedule:
    # 13:00 UTC equivale a las 10:00 AM de Chile (en horario UTC-3).
    # 0 = Domingo (Informe Semanal), 1-5 = Lunes a Viernes (Informe Diario).
    - cron: '0 13 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar-terminal:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        run: pip install -r requirements.txt

      - name: Ejecutar tubería completa
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python motor_datos.py
          python generar_informe.py

      - name: Guardar resultados en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_hoy.json informe_hoy.md
          git commit -m "Actualizacion automatica: datos e informe del dia" || echo "Sin cambios para guardar"
          git push
